
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Open Trivia Quiz</h1>
    <p>Test your knowledge with 10 questions!</p>

    <label for="category">Choose a category:</label>
    <select id="category">
        <option value="">Any Category</option>
        <option value="18">Science: Computers</option>
        <option value="17">Science & Nature</option>
        <option value="21">Sports</option>
        <option value="23">History</option>
    </select>

    <br><br>

    <label for="difficulty">Choose difficulty:</label>
    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
    </select>

    <br><br>

    <button id="start-btn">Start Quiz</button>

    <p id="message"></p>
    
<section id="quiz-area" hidden>
    <p id="progress">Question 1 of 10</p>
    <p id="timer">Time left: 15s</p>

    <h2 id="question">Your question will appear here</h2>

    <div id="answers"></div>

    <p id="feedback"></p>

    <button id="next-btn" hidden>Next Question</button>
</section>


<section id="result-area" hidden>
    <h2>Quiz Completed!</h2>

    <p id="final-score"></p>

    <p id="high-score"></p>

    <h3>Review Incorrect Answers</h3>
    <div id="review-area"></div>

    <button id="play-again-btn">Play Again</button>
</section>


</body>
</html>
